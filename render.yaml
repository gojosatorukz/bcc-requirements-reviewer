services:
  - type: web
    name: razbor-tz
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: "off"
    dockerCommand: python -m cloud.public
    healthCheckPath: /healthz
    envVars:
      - key: REVIEW_PROVIDER
        value: openai
      - key: REVIEW_MODEL
        value: gpt-6.2-sol
      - key: OPENAI_API_KEY
        sync: false
